name = "vole_mole"
version = "0.1.0"
defaultTargets = ["VoleMole"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc1"

[[lean_lib]]
name = "VoleMole"

# Differential tests of the Lean constraint generators against the C++ (lean/vectors/).
[[lean_exe]]
name = "arith_vectors"
root = "VoleMole.Arith.VectorsMain"

# Known-answer cross-checks of the protocol specs (Spec/) against the C++: run from lean/ as
# `lake exe spec_kats` (reads tests/*/..._kat.txt and lean/vectors/uov_keys.txt).
[[lean_exe]]
name = "spec_kats"
root = "VoleMole.Spec.Kats"
