[package]
name = "vole-mole"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust port of VOLE-IHAT and VOLE-ACT"
license = "Apache-2.0"

[dependencies]
aes = "0.9.4"
getrandom = "0.4.3"
hybrid-array = "0.4"
keccak = { version = "0.2.2", features = ["parallel"] }
sha3 = "0.12.0"

[dev-dependencies]
criterion = { version = "0.7", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1

[profile.test]
opt-level = 3

[[bench]]
name = "protocols"
harness = false
