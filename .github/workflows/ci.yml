name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.sanitize && ', asan+ubsan' || '' }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are Apple Silicon (aarch64); Ubuntu runners are x86_64. Between them, both
        # of faest-arch-opt's ISA-specific code paths are covered.
        os: [macos-latest, ubuntu-latest]
        sanitize: [false, true]
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # The compiler is reinstalled on each run, so its mtime, ccache's default check, changes.
      CCACHE_COMPILERCHECK: '%compiler% --version'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja llvm@22 ccache
          echo "CC=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@22)/bin/clang++" >> "$GITHUB_ENV"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          pipx install meson
          sudo apt-get install -y ninja-build ccache
          echo "CC=clang-22" >> "$GITHUB_ENV"
          echo "CXX=clang++-22" >> "$GITHUB_ENV"

      # See the lint job. Meson picks up ccache by itself.
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build
            subprojects/*
            !subprojects/*.wrap
            !subprojects/packagefiles
            .ccache
          key: build-${{ matrix.os }}-${{ matrix.sanitize }}-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}-${{ github.sha }}
          restore-keys: build-${{ matrix.os }}-${{ matrix.sanitize }}-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}-

      # The sanitized build keeps the default debugoptimized build type: at -O0, the slowest tests
      # come close to their timeouts. meson test sets halt_on_error=1 for both sanitizers.
      - name: Configure
        run: >-
          meson setup --reconfigure build
          ${{ matrix.sanitize && '-Db_sanitize=address,undefined -Db_lundef=false' || '' }}
          || meson setup --wipe build
          ${{ matrix.sanitize && '-Db_sanitize=address,undefined -Db_lundef=false' || '' }}

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          pipx install meson
          sudo apt-get install -y ninja-build clang-format-22 clang-tidy-22
          echo "CC=clang-22" >> "$GITHUB_ENV"
          echo "CXX=clang++-22" >> "$GITHUB_ENV"

      - name: clang-format
        run: git ls-files -z '*.c' '*.cpp' '*.h' '*.hpp' | xargs -0 clang-format-22 --dry-run -Werror

      # Generating faest-arch-opt's CRT tables takes minutes of Python, so cache the build directory
      # with the subproject checkouts: a fresh checkout of this repository then leaves their outputs
      # up to date. A change to the wraps or patches starts afresh.
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build
            subprojects/*
            !subprojects/*.wrap
            !subprojects/packagefiles
          key: build-lint-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}-${{ github.sha }}
          restore-keys: build-lint-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}-

      # clang-tidy needs compile_commands.json, which meson setup writes, and also the headers that
      # faest-arch-opt generates at build time, but nothing else from the build.
      - name: Configure
        run: meson setup --reconfigure build || meson setup --wipe build

      - name: Generate headers
        run: meson compile -C build $(meson introspect build --targets | jq -r '.[].name | select(endswith(".hpp"))')

      # Pass headers explicitly: run-clang-tidy only checks files listed in compile_commands.json.
      # Each file's output is buffered so that parallel runs don't interleave.
      - name: clang-tidy
        run: |
          git ls-files -z '*.cpp' '*.hpp' | xargs -0 -n1 -P"$(nproc)" sh -c \
            'out=$(clang-tidy-22 -p build -quiet "$1" 2>&1) || { printf "%s\n" "$out"; exit 1; }' sh

  # The Rust tests on wasm32, with and without simd128, in headless Chrome. The runner image
  # ships Chrome and chromedriver.
  rust-wasm:
    name: rust-wasm${{ matrix.simd128 && ' (simd128)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        simd128: [false, true]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      WASM_BINDGEN_USE_BROWSER: 1
      RUSTFLAGS: ${{ matrix.simd128 && '-C target-feature=+simd128' || '' }}
    steps:
      - uses: actions/checkout@v4

      # Dependencies only change with Cargo.lock; RUSTFLAGS differs between the two jobs.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: rust-wasm-${{ matrix.simd128 }}-${{ hashFiles('rust/Cargo.lock') }}

      # The runner's version must match the wasm-bindgen in Cargo.lock. The release binary saves
      # building it from source.
      - name: Install dependencies
        run: |
          rustup target add wasm32-unknown-unknown
          v=$(cargo pkgid wasm-bindgen | cut -d@ -f2)
          f=wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/$f"
          curl -fsSLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/$f.sha256sum"
          echo "$(cut -d" " -f1 "$f.sha256sum")  $f" | sha256sum -c
          tar -xzf "$f" -C ~/.cargo/bin --strip-components=1 --wildcards "*/wasm-bindgen*"
          echo "CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --release --locked --target wasm32-unknown-unknown
